<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Groove - Film & TV</title>
    <link rel="icon" type="image/svg+xml" href="Asset 1.svg">
    <link rel="stylesheet" href="stylefilmtv.css">
</head>
<body>

    <!-- Overlay de Navegação Fullscreen -->
    <div class="nav-overlay" id="nav-overlay">
        <button class="nav-close" id="nav-close" aria-label="Fechar menu">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </button>

        <nav class="nav-content">
            <a href="directors.html">Directors</a>
            <a href="photographers.html">Photographers</a>
            <a href="filmtv.html" class="active">Film & TV</a>
            <a href="Production Services.html">Production Services</a>
            <a href="https://spritz.com.br/" target="_blank" rel="noopener">Spritz</a>
            <a href="us.html">Us.</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>

    <!-- Logo Central -->
    <div class="logo-container" id="logo-toggle">
        <img src="Asset 1.svg" alt="B Groove Logo">
    </div>

    <!-- Título -->
    <header class="page-header">
        <h1 class="page-title">Film & TV.</h1>
        <p class="page-subtitle">Uma seleção de projetos para cinema e televisão.</p>
    </header>

    <!-- Túnel 3D Horizontal -->
    <div class="tunnel-horizontal">
        <div class="scene-horizontal" id="poster-scene"></div>
    </div>

    <!-- Modal de Detalhes -->
    <div class="modal" id="movie-modal" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal></div>
        <div class="modal-content" role="dialog" aria-modal="true">
            <button class="modal-close" id="modal-close" aria-label="Fechar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                </svg>
            </button>
            <div class="modal-body" id="modal-body">
                <!-- Conteúdo injetado pelo JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <p class="footer-desc">B Groove - Creative Production House. 2026.</p>
        <a href="https://www.instagram.com/bgroove.co/" target="_blank" rel="noopener" class="footer-instagram">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <span>@bgroove</span>
        </a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="scriptfilmtv.js"></script>

</body>
</html>
